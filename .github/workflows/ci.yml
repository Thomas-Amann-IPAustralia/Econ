name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev          # runtime and dev only: no torch, no models, no network in tests
      - run: uv run ruff check src tests deploy
      - run: uv run ruff format --check src tests deploy
      - run: uv run pytest -q
      - name: The front end parses
        run: node --check web/app.js
