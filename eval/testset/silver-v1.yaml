  # --- note-tm-leading-indicator ----------------------------------------------------------------------------
  - id: note-tm-1
    kind: lookup
    question: How much does a rise in trade mark filings predict about GDP growth?
    gold:
      - doc_id: note-tm-leading-indicator
        quote: Linear regression model estimates suggest that every 10% increase per quarter in the number of trade mark applications filed in Australia predicts an approximate 1.8% increase in real GDP in the next quarter
  - id: note-tm-2
    kind: explain
    question: How did the trade mark study check that its link with GDP isn't spurious?
    gold:
      - doc_id: note-tm-leading-indicator
        quote: The results of this Engle-Granger test indicated that trade marks and real GDP time series are cointegrated
  - id: note-tm-3
    kind: paraphrase
    question: Are new brand registrations a better early warning of the economy than consumer confidence?
    gold:
      - doc_id: note-tm-leading-indicator
        quote: we demonstrate the ability of new trade mark filings to predict economic cycles, ranking above other highly regarded indicators such as current gross domestic product and the consumer confidence index.

