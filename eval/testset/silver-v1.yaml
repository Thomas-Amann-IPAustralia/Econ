# Silver retrieval test set v1.
# Written by Claude (in the build session, 2026-10-18) from a seeded random sample of passages per document
# (8 candidate passages each, drawn from body text away from the front and back matter). Questions are
# phrased as a researcher at IP Australia might ask them, mostly avoiding the passage's own wording.
# Each gold quote is verbatim from the parsed text. The loader counts every verbatim copy of a quote,
# anywhere in the corpus, as an equally correct find; `alt` adds restatements in other words.
# Kinds: lookup (a fact or figure), explain (a reason, mechanism or method), paraphrase (everyday words
# for a technical passage), trend (a change over time), multi (needs two or more passages).
# It measures finding the passage a question was written from. It is not a substitute for the TREC-style
# set with pooled, model-judged results (SOP §17), which needs a model budget.
version: silver-v1
needs:
  # --- erp01-patent-backlogs ---------------------------------------------------------------------------
  - id: erp01-1
    kind: lookup
    question: How did IP Australia's patent workload per examiner compare with the UK and US offices?
    gold:
      - doc_id: erp01-patent-backlogs
        quote: Even then it is higher, by far, than comparable figures for other offices, where the UK-IPO had 198 applications in the inventory for every examiner, and the USPTO had 169.
  - id: erp01-2
    kind: explain
    question: What happens when IP Australia directs a patent applicant to request examination, and how often does it do so?
    gold:
      - doc_id: erp01-patent-backlogs
        quote: During these five years IP Australia may choose to issue a direction to any applicant, and this direction requires the applicant to file a request for examination within six months.
  - id: erp01-3
    kind: paraphrase
    question: If nobody forces them to, how soon after filing do patent applicants ask for examination?
    gold:
      - doc_id: erp01-patent-backlogs
        quote: Applicants who request examination without a direction have done so overwhelmingly in the first month after filing.
  - id: erp01-4
    kind: trend
    question: How large did the backlog of pending patent applications get, and when did it peak?
    gold:
      - doc_id: erp01-patent-backlogs
        quote: This growth in inventory peaked around 100,000 applications in 2010 and has fallen steadily since then.
        alt:
          - doc_id: erp01-patent-backlogs
            quote: This growth in inventory peaked at 100,000 pending applications in 2010 and has fallen steadily since then.

