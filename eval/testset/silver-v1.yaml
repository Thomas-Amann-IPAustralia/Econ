  # --- erp10-ip-profitability-competition ----------------------------------------------------------------
  - id: erp10-1
    kind: trend
    question: What share of Australian businesses own a registered IP right, and how has that changed?
    gold:
      - doc_id: erp10-ip-profitability-competition
        quote: The number of businesses that owned at least one registrable IPR increased from 15 195 in 2001-02 to 28 384 in 2015-16, accounting for 2.3 and 4.2 per cent of active businesses respectively.
  - id: erp10-2
    kind: explain
    question: Why did the study of IP and business profitability use GMM estimation?
    gold:
      - doc_id: erp10-ip-profitability-competition
        quote: While including the lagged dependent variable is methodologically necessary, it also introduces a risk of new endogeneity in the model.
  - id: erp10-3
    kind: lookup
    question: Which combinations of IP rights go with the most profitable businesses?
    gold:
      - doc_id: erp10-ip-profitability-competition
        quote: Businesses with both patents and trade marks, all three IPRs, and both trade marks and designs are the top three ownership types for highest average profitability.
  - id: erp10-4
    kind: paraphrase
    question: Does holding a bigger pile of IP rights make a firm more profitable?
    gold:
      - doc_id: erp10-ip-profitability-competition
        quote: However, the number of IPRs that a business owns does not appear to be significantly associated with business profitability.
  - id: erp10-5
    kind: paraphrase
    question: Is there evidence that IP rights are hurting competition across Australian industries?
    gold:
      - doc_id: erp10-ip-profitability-competition
        quote: We did not find any significant impact of IPRs on market concentration at an industry level.

