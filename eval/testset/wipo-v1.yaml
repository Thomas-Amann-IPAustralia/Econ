  # --- wipo-wipi-2025 -----------------------------------------------------------------------------------
  - id: wipi-1
    kind: lookup
    question: Applicants from which country file the most patent applications in other countries?
    gold:
      - doc_id: wipo-wipi-2025
        quote: US-based applicants filed the most patent applications abroad in 2024, with a total of at least 231,536.
  - id: wipi-2
    kind: explain
    question: What is a foreign-oriented patent family?
    gold:
      - doc_id: wipo-wipi-2025
        quote: those patent families that have at least one filing office different from the office of the applicant's country of origin
  - id: wipi-3
    kind: explain
    question: Why can some patent offices not quickly reduce their stock of pending applications?
    gold:
      - doc_id: wipo-wipi-2025
        quote: an office is unable to start the substantive examination process until an applicant has filed a request for examination
  - id: wipi-4
    kind: lookup
    question: Applicants from which countries file the most industrial designs worldwide?
    gold:
      - doc_id: wipo-wipi-2025
        quote: In 2024, applicants based in China filed applications containing 906,849 designs - the highest total worldwide.
  - id: wipi-5
    kind: explain
    question: What roles does the European Patent Office play in international patent applications?
    gold:
      - doc_id: wipo-wipi-2025
        quote: Under Patent Cooperation Treaty (PCT) procedures, the EPO acts as a receiving office, an International Searching Authority and an International Preliminary Examining Authority.
  - id: wipi-6
    kind: paraphrase
    question: Does filing one international patent application get you a patent in many countries at once?
    gold:
      - doc_id: wipo-wipi-2025
        quote: However, the decision on whether to grant patent rights remains the prerogative of national and regional patent offices
  - id: wipi-7
    kind: explain
    question: Under the Hague and Madrid systems, how does an applicant choose where they want protection?
    gold:
      - doc_id: wipo-wipi-2025
        quote: specifies the jurisdiction(s) in which they seek to protect their designs (Hague System) or trademarks (Madrid System)
