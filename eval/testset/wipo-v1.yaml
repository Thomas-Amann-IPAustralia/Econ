  # --- wipo-pct-2026 ------------------------------------------------------------------------------------
  - id: pct-1
    kind: trend
    question: How many international patent applications were filed in 2025, and is the number still growing?
    gold:
      - doc_id: wipo-pct-2026
        quote: About 275,900 international patent applications (PCT applications) were filed via WIPO's Patent Cooperation Treaty (PCT) in 2025
  - id: pct-2
    kind: trend
    question: Which countries saw the biggest falls in international patent filings in 2025?
    gold:
      - doc_id: wipo-pct-2026
        quote: while India (-32.4%), Israel (-7%) and Switzerland (-6.3%) registered the steepest declines
  - id: pct-3
    kind: lookup
    question: Which large companies increased their international patent filings the fastest in 2025?
    gold:
      - doc_id: wipo-pct-2026
        quote: LG Energy Solution (+34.8%), Panasonic (+21.9%) and LG Electronics (+15.2%) exhibited the fastest growth
