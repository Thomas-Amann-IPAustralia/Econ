  # --- wipo-pct-2026 ------------------------------------------------------------------------------------
  - id: pct-1
    kind: trend
    question: How many international patent applications were filed in 2025, and is the number still growing?
    gold:
      - doc_id: wipo-pct-2026
        quote: About 275,900 international patent applications (PCT applications) were filed via WIPO's Patent Cooperation Treaty (PCT) in 2025
  - id: pct-2
    kind: trend
    question: Which countries saw the biggest falls in international patent filings in 2025?
    gold:
      - doc_id: wipo-pct-2026
        quote: while India (-32.4%), Israel (-7%) and Switzerland (-6.3%) registered the steepest declines
  - id: pct-3
    kind: lookup
    question: Which large companies increased their international patent filings the fastest in 2025?
    gold:
      - doc_id: wipo-pct-2026
        quote: LG Energy Solution (+34.8%), Panasonic (+21.9%) and LG Electronics (+15.2%) exhibited the fastest growth
  - id: pct-4
    kind: explain
    question: What does a receiving office do in the international patent application process?
    gold:
      - doc_id: wipo-pct-2026
        quote: ROs are responsible for receiving PCT applications, examining compliance with PCT formality requirements, receiving payment of fees
  - id: pct-5
    kind: lookup
    question: Which patent offices still receive a sizeable share of international applications on paper?
    gold:
      - doc_id: wipo-pct-2026
        quote: the Russian Federation (42.2%), France (16.3%) and Germany (6.9%) recorded relatively high shares of PCT applications filed on paper.
  - id: pct-6
    kind: lookup
    question: How quickly do national offices pass international patent applications on to WIPO?
    gold:
      - doc_id: wipo-pct-2026
        quote: ROs transmitted PCT applications to the IB within an average of 2.7 weeks after the international filing date
  - id: pct-7
    kind: lookup
    question: Which patent offices produce the most international search reports?
    gold:
      - doc_id: wipo-pct-2026
        quote: The EPO issued 81,819 ISRs and the office of China issued 69,143
  - id: pct-8
    kind: explain
    question: How long does an applicant have to take an international patent application into the national phase?
    gold:
      - doc_id: wipo-pct-2026
        quote: An entry must in general take place within 30 months from the priority date of the application
