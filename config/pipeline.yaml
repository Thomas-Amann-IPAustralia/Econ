# Pipeline configuration. Tune behaviour here, not in code. Unknown keys are errors.
# `adopted` values change only when the owner adopts a measured recommendation (docs/decisions.md).

paths:
  raw: data/raw
  library: library
  manifests: manifests
  reports: reports
  models: data/models

parse:
  ocr_min_chars_per_page: 100   # a page with fewer text-layer characters counts as image-only
  ocr_page_share: 0.5           # OCR the whole document when at least this share of pages is image-only
  ocr_scale: 2.0                # render scale for OCR; 1.0 garbled the 2018 report in a probe
  threads: 2                    # per worker; `econ parse --workers 2` uses all 4 vCPUs
  table_structure: true

chunking:
  # Token counts use one reference tokenizer, so every embedder sees the same chunks. It is the
  # uncased WordPiece vocabulary that all the 512-token candidates share; the ModernBERT and Qwen
  # candidates take 8k+ tokens, so they never truncate.
  tokenizer: BAAI/bge-small-en-v1.5
  tokenizer_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  strategies:
    F384:            # baseline: fixed windows over the document's reading-order text
      kind: fixed
      max_tokens: 384
      overlap_tokens: 64
      prefix: title
    S256:
      kind: structure
      max_tokens: 256
    S384:
      kind: structure
      max_tokens: 384
    S512:
      kind: structure
      max_tokens: 512
    S384-noprefix:   # ablation of the heading prefix
      kind: structure
      max_tokens: 384
      prefix: none
    S384-noprefix-nocite:   # D-007: without bibliography entries and citation-only endnotes
      kind: structure
      max_tokens: 384
      prefix: none
      drop_citations: true
  adopted: S384-noprefix-nocite   # D-005, refined in D-007

embedding:
  batch_size: 16
  # Screened: permissive licence, no trust_remote_code, pinned revision. Public benchmarks only
  # shortlisted them. `onnx_file` names the repository's own single-file ONNX export where it has one;
