retrieval:
  lane_depth: 100      # candidates taken from each lane before fusion
  fusion: score        # min-max normalised score fusion; kept over rrf and other weights (D-006)
  alpha: 0.7           # weight on the dense lane
  rrf_k: 60
  context_chunks: 20   # passages given to the answer model
  per_doc_cap: 8       # at most this many of those from one document

reranking:
  # Cross-encoders screened for the judged grid (retrieval-v2): permissive licence, no trust_remote_code,
  # pinned revision, and a repository ONNX export. Served from the Cloud Run embedder service when adopted.
  depth: 50
  candidates:
    ettin-17m:
      hf_id: cross-encoder/ettin-reranker-17m-v1
      revision: 9e4aa35321a6dd1a43ca313f500c4b4f7cfb5cc6
