# The corpus registry. One entry per object in the R2 bucket; the fetch stage fails if the two disagree.
# Identity is the R2 object key (the source's canonical id). doc_id is a stable, readable alias used in
# chunk ids and citations; never change a doc_id once answers cite it.
# `url` is the authoritative public copy, where one is known; the UI links to it beside the in-app viewer.
