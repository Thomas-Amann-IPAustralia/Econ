# The corpus registry. One entry per object in the R2 bucket; the fetch stage fails if the two disagree.
# Identity is the R2 object key (the source's canonical id). doc_id is a stable, readable alias used in
# chunk ids and citations; never change a doc_id once answers cite it.
# `url` is the publisher's page for the document, checked to resolve on 2026-10-18 (17 of 24 found; the
# rest are left empty rather than guessed). The UI links to it beside the in-app viewer.
# `publisher` is the default; a document from another publisher names its own (the WIPO documents, D-033).
# `data` lists bucket objects that are not documents of their own but data a document's parse reads.
bucket: econ-knowledge
