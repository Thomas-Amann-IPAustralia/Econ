# Evaluation spend and the models that build and judge the test sets. Unknown keys are errors.
# Budgets are the owner's (2026-10-18: "a maximum of $2.50 on OpenAI tokens and $2.50 on Google
# (Gemini) tokens"). Code enforces them: a paid call starts only if the ledger's total plus the call's
# reserve fits under `cap_fraction` of the budget, so a mis-estimate can't overrun it.
budgets_usd:
  openai: 2.50
  gemini: 2.50
cap_fraction: 0.96
ledger: eval/spend/ledger.jsonl
cache: eval/cache/llm          # every paid response, kept for good (SOP §14.1)
